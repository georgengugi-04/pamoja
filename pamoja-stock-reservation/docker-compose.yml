services:
  db:
    image: postgres:16-alpine
    container_name: pamoja-postgres
    environment:
      POSTGRES_USER: pamoja
      POSTGRES_PASSWORD: pamoja_dev_password   # local development placeholder only
      POSTGRES_DB: pamoja
    ports:
      - "5432:5432"
    volumes:
      - pamoja_pgdata:/var/lib/postgresql/data
      # Creates the separate pamoja_test database on first start
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pamoja -d pamoja"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional: run the API itself in Docker.  docker compose --profile app up -d --build
  api:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://pamoja:pamoja_dev_password@db:5432/pamoja
      RESERVATION_TTL_MINUTES: "15"
    ports:
      - "3000:3000"
    command: sh -c "node dist/config/migrate-cli.js && node dist/server.js"

volumes:
  pamoja_pgdata:
